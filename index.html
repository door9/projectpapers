<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Project Papers</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fff1e5">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 선 아이콘 모음: <svg class="ico"><use href="#i-이름"/></svg> 로 꺼내 쓴다 (JS 에선 ico('이름')) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="3" width="11.5" height="14.5" rx="1.5"/><path d="M5 7v12.5q0 1.5 1.5 1.5H16"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5Q3 6 4.5 6h4.3l2 2.2h8.7Q21 8.2 21 9.7v8.8q0 1.5-1.5 1.5h-15Q3 20 3 18.5z"/></symbol>
  <symbol id="i-folder-move" viewBox="0 0 24 24"><path d="M3 7.5Q3 6 4.5 6h4.3l2 2.2h8.7Q21 8.2 21 9.7v8.8q0 1.5-1.5 1.5h-15Q3 20 3 18.5z M9 14h6.5 M13 11.5l2.5 2.5-2.5 2.5"/></symbol>
  <symbol id="i-template" viewBox="0 0 24 24"><path d="M6.5 3h7.5l4.5 4.5v12q0 1.5-1.5 1.5h-10.5Q5 21 5 19.5v-15Q5 3 6.5 3z M14 3v4.5h4.5 M8.5 12.5h7 M8.5 16h5"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8.5 13.5 4 9l4.5-4.5 M4 9h10.5a5.5 5.5 0 0 1 0 11H10"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15.5 13.5 20 9l-4.5-4.5 M20 9H9.5a5.5 5.5 0 0 0 0 11H14"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C10.5 5 8 4.5 3 4.5v14c5 0 7.5.5 9 2 1.5-1.5 4-2 9-2v-14c-5 0-7.5.5-9 2z M12 6.5v14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3 20.5 20.5"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 14.5V3.5 M7.5 8 12 3.5 16.5 8 M5 12.5V19q0 1.5 1.5 1.5h11Q19 20.5 19 19v-6.5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.85L12 16.9l-5.25 2.75 1-5.85L3.5 9.7l5.9-.9z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6.5h16 M9.5 6.5v-2q0-1 1-1h3q1 0 1 1v2 M6 6.5l1 13q.1 1.5 1.6 1.5h6.8q1.5 0 1.6-1.5l1-13 M10 10.5v6.5 M14 10.5v6.5"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="18.5" r="1.5" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6.5h16 M4 12h16 M4 17.5h16"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3.5h11l4.5 4.5v11q0 1.5-1.5 1.5H5Q3.5 20.5 3.5 19V5Q3.5 3.5 5 3.5z M7.5 3.5v5h8v-5 M7.5 20.5V14h9v6.5"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.35-5.65 M20 3.5V8h-4.5"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="16" r="4.5"/><path d="M11.2 12.8 20 4 M16.5 7.5 19 10 M14 10l2 2"/></symbol>
  <symbol id="i-select" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M8 12.2l2.8 2.8L16 9.5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L9 19l-5 1 1-5z M13 7l4 4"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="1.5"/><path d="M8 10.5v-3a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="1.5"/><path d="M8 10.5v-3a4 4 0 0 1 7.8-1.3"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A7.5 7.5 0 1 1 9.5 4.5a6 6 0 0 0 10 10z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2 M12 19.5v2 M2.5 12h2 M19.5 12h2 M5.3 5.3l1.4 1.4 M17.3 17.3l1.4 1.4 M5.3 18.7l1.4-1.4 M17.3 6.7l1.4-1.4"/></symbol>
  <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3 7.5Q3 6 4.5 6h4.3l2 2.2h8.7Q21 8.2 21 9.7v8.8q0 1.5-1.5 1.5h-15Q3 20 3 18.5z M12 11v6 M9 14h6"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></g></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12 M18 6 6 18"/></symbol>
</svg>

<div id="app" style="display:none">
  <button id="menu-toggle"><svg class="ico"><use href="#i-menu"/></svg></button>

  <aside id="sidebar">
    <div id="sidebar-header">
      <h1>
        Project Papers
        <span style="display:flex;align-items:center;gap:6px;">
          <button class="btn-backup" id="btn-backup" title="백업"><svg class="ico"><use href="#i-save"/></svg></button>
          <button class="btn-backup" id="btn-sync" title="동기화"><svg class="ico"><use href="#i-sync"/></svg></button>
          <span id="sync-status">오프라인</span>
        </span>
      </h1>
      <div id="save-sync-times">
        <span id="last-saved-time"></span>
        <span id="last-synced-time"></span>
      </div>
      <div id="search-row">
        <input type="text" id="search-box" placeholder="메모 검색...">
        <button class="btn-search-key" id="btn-master-unlock" title="Master로 전체 잠금 해제"><svg class="ico"><use href="#i-key"/></svg></button>
      </div>
      <div id="sidebar-actions">
        <button class="btn btn-primary" id="btn-new">+New</button>
        <button class="btn btn-fav-filter" id="btn-fav-filter" title="즐겨찾기 필터"><svg class="ico"><use href="#i-star"/></svg></button>
        <button class="btn btn-secondary" id="btn-folder-toggle" title="폴더 필터"><svg class="ico"><use href="#i-folder"/></svg> 전체</button>
      </div>
      <div id="sidebar-actions-row2">
        <select id="memo-sort" title="정렬">
          <option value="updatedAt">수정일순</option>
          <option value="createdAt">생성일순</option>
          <option value="title">제목순</option>
        </select>
        <button class="btn btn-select-mode" id="btn-select-mode" title="선택 모드"><svg class="ico"><use href="#i-select"/></svg></button>
      </div>
      <div id="bulk-actions" style="display:none">
        <button class="btn btn-secondary" id="btn-bulk-move"><svg class="ico"><use href="#i-folder"/></svg> 이동</button>
        <button class="btn btn-primary" id="btn-bulk-delete"><svg class="ico"><use href="#i-trash"/></svg> 삭제</button>
        <button class="btn btn-secondary" id="btn-bulk-cancel">취소</button>
      </div>
    </div>
    <div id="sidebar-scroll">
      <div id="folder-dropdown" class="folder-dropdown" style="display:none">
        <div id="folder-list"></div>
        <div class="folder-dropdown-foot">
          <button class="folder-add-btn" id="btn-folder-add">+ 새 폴더</button>
          <button class="folder-add-btn" id="btn-folder-manage">폴더 관리</button>
        </div>
      </div>
      <div id="memo-list"></div>
    </div>
    <div id="sidebar-footer">
      <button id="btn-master-pw">Master</button>
      <button id="btn-trash"><svg class="ico"><use href="#i-trash"/></svg> 휴지통</button>
      <button id="btn-logout">로그아웃</button>
    </div>
  </aside>

  <main id="editor-area">
    <div id="editor-toolbar" style="display:none">
      <div id="toolbar-buttons">
        <div id="folder-select-wrap">
          <button class="btn-icon" id="btn-folder-select" title="폴더 선택"><svg class="ico"><use href="#i-folder"/></svg></button>
          <div id="folder-select-dropdown" style="display:none">
            <div id="folder-select-list"></div>
          </div>
        </div>
        <div id="template-wrap">
          <button class="btn-icon" id="btn-template" title="템플릿"><svg class="ico"><use href="#i-template"/></svg></button>
          <div id="template-dropdown" style="display:none">
            <div id="template-list"></div>
            <button class="template-action-btn" id="btn-template-save">+ 현재 메모를 템플릿으로 저장</button>
          </div>
        </div>
        <div id="toolbar-right">
          <button class="btn-icon" id="btn-copy" title="복사"><svg class="ico"><use href="#i-copy"/></svg></button>
          <button class="btn-icon" id="btn-undo" title="되돌리기"><svg class="ico"><use href="#i-undo"/></svg></button>
          <button class="btn-icon" id="btn-redo" title="되살리기" style="display:none"><svg class="ico"><use href="#i-redo"/></svg></button>
          <button class="btn-icon" id="btn-viewer" title="보기 모드"><svg class="ico"><use href="#i-book"/></svg></button>
          <button class="btn-icon" id="btn-find" title="찾기/바꾸기"><svg class="ico"><use href="#i-search"/></svg></button>
          <button class="btn-icon" id="btn-share" title="공유" style="display:none"><svg class="ico"><use href="#i-share"/></svg></button>
          <button class="btn-icon toolbar-extra" id="btn-fav" title="즐겨찾기"><svg class="ico"><use href="#i-star"/></svg></button>
          <button class="btn-icon toolbar-extra" id="btn-delete" title="삭제"><svg class="ico"><use href="#i-trash"/></svg></button>
        </div>
        <button class="btn-icon" id="btn-toolbar-more" title="더보기"><svg class="ico"><use href="#i-more"/></svg></button>
      </div>
      <input type="text" id="memo-title-input" placeholder="제목을 입력해 주세요" autocomplete="off">
      <div id="memo-dates" style="display:none">
        <span id="memo-dates-text"></span>
        <button id="btn-help" type="button" title="사용 도움말·팁">도움말</button>
      </div>
    </div>
    <button id="toolbar-reveal" type="button" title="메뉴 펼치기">▼</button>
    <div id="find-replace-bar" style="display:none">
      <div class="find-row">
        <input type="text" id="find-input" placeholder="찾기">
        <button class="btn-sm" id="find-btn">찾기</button>
        <button class="btn-sm" id="find-all-btn">모두</button>
        <span id="find-count"></span>
        <button class="btn-sm" id="find-prev">▲</button>
        <button class="btn-sm" id="find-next">▼</button>
      </div>
      <div class="find-row">
        <input type="text" id="replace-input" placeholder="바꾸기">
        <button class="btn-sm" id="replace-one">바꾸기</button>
      </div>
    </div>
    <div id="editor-container" style="display:none">
      <div id="editor-highlight"></div>
      <textarea id="editor" placeholder="Hello, there?"></textarea>
    </div>
    <div id="char-count" style="display:none"></div>
    <div id="empty-state">
      <div class="icon">📝</div>
      <div>There you are!</div>
    </div>
  </main>
</div>

<div id="login-screen">
  <h1>Project Papers</h1>
  <p>Dropbox와 동기화되는 개인 메모 앱입니다. 로그인하여 시작하세요.</p>
  <button class="btn-dropbox" id="btn-login">Dropbox로 로그인</button>
  <p style="font-size:0.8rem; color:#666; margin-top:20px;">
    오프라인 모드로도 사용 가능합니다.<br>
    <a href="#" id="btn-offline" style="color:var(--accent)">오프라인으로 시작</a>
  </p>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
